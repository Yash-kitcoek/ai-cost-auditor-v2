<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  
  <!-- Gradient blobs -->
  <circle cx="100" cy="100" r="400" fill="url(#blob1)" opacity="0.15"/>
  <circle cx="1100" cy="530" r="400" fill="url(#blob2)" opacity="0.1"/>
  
  <defs>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Badge -->
  <rect x="450" y="80" width="300" height="40" rx="20" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="600" y="105" text-anchor="middle" fill="#a5b4fc" font-size="14" font-family="system-ui" letter-spacing="2">FREE · NO LOGIN · 60 SECONDS</text>
  
  <!-- Main headline -->
  <text x="600" y="220" text-anchor="middle" fill="white" font-size="64" font-weight="900" font-family="system-ui">Are you overpaying</text>
  <text x="600" y="300" text-anchor="middle" fill="url(#textGrad)" font-size="64" font-weight="900" font-family="system-ui">for AI tools?</text>
  
  <!-- Subtext -->
  <text x="600" y="370" text-anchor="middle" fill="#555555" font-size="22" font-family="system-ui">Instant audit of Cursor, Claude, ChatGPT, Copilot and more.</text>
  <text x="600" y="400" text-anchor="middle" fill="#555555" font-size="22" font-family="system-ui">Find overspending in 60 seconds. Free forever.</text>
  
  <!-- Bottom CTA buttons -->
  <rect x="380" y="460" width="200" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="480" y="491" text-anchor="middle" fill="#888888" font-size="18" font-family="system-ui">aicostaudit.com</text>
  
  <rect x="620" y="460" width="200" height="50" rx="12" fill="url(#textGrad)"/>
  <text x="720" y="491" text-anchor="middle" fill="white" font-size="18" font-weight="700" font-family="system-ui">Run Free Audit →</text>
